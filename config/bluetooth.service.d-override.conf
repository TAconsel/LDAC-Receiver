# Installed as /etc/systemd/system/bluetooth.service.d/override.conf
#
# Runs the locally built bluetoothd from patches/bluez-a2dp-imtu.patch instead
# of the packaged one.  The patch raises the L2CAP incoming MTU advertised for
# AVDTP from the 672-byte default to 1024; below 679 a sender's LDAC encoder
# refuses to initialise, so LDAC can be negotiated but never actually streams.
# See the patch header for the full explanation.
#
# The distribution binary is left untouched at /usr/libexec/bluetooth/bluetoothd
# — drop this file and the original is back in use.

[Service]
ExecStart=
ExecStart=/usr/local/libexec/bluetooth/bluetoothd
