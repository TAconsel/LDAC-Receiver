# Installed as /etc/systemd/system/bluealsa.service.d/override.conf
#
# This machine is a receiver, so only the A2DP Sink profile is registered —
# a2dp-source would additionally advertise this box as something you can send
# audio *to* another device from, which it is not.
#
# LDAC is not one of the codecs BlueALSA enables by default (that set is SBC,
# AAC, CVSD, mSBC and LC3-SWB), so it has to be asked for.  Without --all-codecs
# a sender is only ever offered SBC and AAC no matter what the decoder supports.
#
# --keep-alive holds the transport open briefly between tracks so a short gap
# does not tear down and re-establish the stream.

[Service]
ExecStart=
ExecStart=/usr/local/bin/bluealsad -S -p a2dp-sink --all-codecs --keep-alive=5
