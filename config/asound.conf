# ALSA configuration for the LDAC receiver.  Installed as /etc/asound.conf.
#
# The Behringer UMC404HD is a fixed 4-channel device and accepts S16_LE or
# S32_LE at 44.1-192 kHz.  Its 24-bit samples travel in 32-bit containers, so
# S32_LE at 96000 *is* the 24-bit/96 kHz mode:
#
#     FORMAT:   S16_LE S32_LE
#     CHANNELS: 4
#     RATE:     [44100 192000]
#
# Bluetooth delivers stereo, and the card will not open with 2 channels, so the
# stream has to be widened before it reaches the hardware.  `ldac96` sends L and
# R to outputs 1 and 2 and leaves 3 and 4 silent.  To feed outputs 3 and 4 with
# the same pair, add to its ttable:
#
#     ttable.0.2 1
#     ttable.1.3 1
#
# The rate is pinned rather than followed from the stream, so the interface
# always runs at 24-bit/96 kHz.  LDAC at 96 kHz therefore passes through
# untouched; a 44.1 or 48 kHz stream (SBC, AAC, or LDAC at a lower rate) is
# resampled up to it.

pcm.umc404hd_96k {
	type hw
	card "U192k"
	device 0
	format S32_LE
	rate 96000
	channels 4
}

# Everything reaches the card through this, so two Bluetooth devices can play at
# once: a sound card can only be opened once, and without a mixer here the
# second stream dies with "Device or resource busy".
#
# dmix sums its clients in the 32-bit domain at the slave's own rate and format,
# so nothing is resampled or requantised on the way through, and with a single
# stream the sum is that stream.  The period and buffer match what CamillaDSP
# was already negotiating with the card directly.
pcm.umc404hd_dmix {
	type dmix
	ipc_key 3141592
	ipc_perm 0660
	slave {
		# Format, rate and channels have to be repeated here: dmix does not
		# inherit them from the referenced PCM and otherwise assumes stereo,
		# which fails with "invalid slave channel number 2 in binding to 2".
		pcm "umc404hd_96k"
		format S32_LE
		rate 96000
		channels 4
		# The period matches CamillaDSP's chunksize and the buffer is 341 ms.
		# Not arbitrary: at dmix's usual 2048/16384 the writes become bursty
		# enough to push the jitter back up the pipe, and a 40-second stream
		# logged 50 drain-to-avoid-underrun events instead of 1.
		period_size 4096
		buffer_size 32768
	}
	bindings.0 0
	bindings.1 1
	bindings.2 2
	bindings.3 3
}

pcm.ldac96 {
	type plug
	slave.pcm "umc404hd_dmix"
	ttable.0.0 1
	ttable.1.1 1
}

ctl.umc404hd {
	type hw
	card "U192k"
}

# --- room correction --------------------------------------------------------
#
# `dsp96` is `ldac96` with CamillaDSP convolution in front of it, and is what
# bluealsa-aplay actually plays into.  `ldac96` above stays as the bypass path:
# the two are alternatives, since CamillaDSP opens the card exclusively.
#
# The cdsp plugin presents itself as an ALSA device, starts CamillaDSP when a
# player opens it, and pipes audio to its stdin.  CamillaDSP owns the hardware
# from there — the card, its 4-channel layout and the 24-bit/96 kHz rate are all
# set in /etc/camilladsp/roomcorr.yaml, not here.
#
# config_cdsp passes the stream's format, rate, channel count and extra samples
# to CamillaDSP as -f/-r/-n/-e instead of rewriting the config file, so
# /etc/camilladsp/roomcorr.yaml can stay read-only — which matters because the
# plugin runs inside bluealsa-aplay's systemd sandbox.

pcm.cdsp {
	type cdsp
	cpath "/usr/local/bin/camilladsp"
	config_out "/etc/camilladsp/roomcorr.yaml"
	config_cdsp 1

	# Only 96 kHz stereo is offered: the correction filter is a 96 kHz
	# impulse response and must not be applied at any other rate.  The plug
	# in front converts everything else up to it.
	channels 2
	rates = [ 96000 ]

	# One filter length, so the convolution tail is flushed at end of stream
	# rather than being cut off.
	extra_samples 32768

	cargs [ -l warn ]
}

pcm.dsp96 {
	type plug
	slave {
		pcm "cdsp"
		format S32_LE
		rate 96000
		channels 2
	}
}

# Convenient for `aplay`/`speaker-test` when checking the output by hand.
# This is the bypass device; use `dsp96` to hear the correction.
pcm.!default "ldac96"
ctl.!default "umc404hd"
