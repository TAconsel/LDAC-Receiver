# Installed as /etc/systemd/system/bluealsa-aplay.service.d/override.conf
#
# Plays whatever arrives over A2DP into the `dsp96` PCM from /etc/asound.conf,
# which runs it through CamillaDSP for room correction and on to the UMC404HD at
# 24-bit/96 kHz.  For the uncorrected path, use --pcm=ldac96 instead; the two are
# alternatives, since CamillaDSP opens the card exclusively.
#
# The cdsp plugin forks CamillaDSP from inside this service, so the sandbox has
# to allow it: ProtectSystem=strict already leaves /usr and /etc readable, and
# nothing needs writing because config_cdsp passes the stream parameters on the
# command line rather than rewriting the config.
#
# Volume: the UMC404HD exposes a 128-step playback attenuator with a dB scale
# ('UMC404HD 192k Output', 0 dB at 100%), so --volume=mixer lets the sender's
# volume drive the interface's own attenuator instead of scaling samples in
# software.  At full volume that leaves the decoded stream bit-perfect.
#
# For strictly bit-perfect output that ignores the remote entirely — the mixer
# is then yours to set by hand — use --volume=none instead:
#
#     ExecStart=/usr/local/bin/bluealsa-aplay -S --pcm=dsp96 --volume=none

# Buffer: the default 200 ms is too tight once CamillaDSP sits in the path — the
# player feeds a pipe that is drained in chunks rather than a soundcard draining
# steadily, and Bluetooth delivery is itself bursty, which together produced a
# drain-to-avoid-underrun every few seconds.  500 ms rides over it.  Bluetooth
# already costs ~200 ms and the linear-phase filter another ~45 ms, so this is a
# music receiver, not something to lip-sync video against.

# The PCM is not hard-coded here: it comes from /etc/default/ldac-receiver so the
# web panel can switch the correction on and off by rewriting one line and
# restarting this service, instead of editing a unit.  ${LDAC_PCM} substitutes as
# a single word; the leading `-` on the EnvironmentFile keeps the service
# startable if the file is missing, falling back to the default below.

[Service]
Environment=LDAC_PCM=dsp96
EnvironmentFile=-/etc/default/ldac-receiver
ExecStart=
ExecStart=/usr/local/bin/bluealsa-aplay -S --pcm=${LDAC_PCM} \
    --pcm-buffer-time=500000 --pcm-period-time=125000 \
    --volume=mixer --mixer-device=hw:U192k \
    --mixer-control="UMC404HD 192k Output"
